generations:
  - name: "First Generation"
    start_year: 2006
    end_year: 2011
    description: "The first-generation Mazda BT-50 was developed alongside the Ford Ranger as part of Mazda and Ford's strategic partnership, though it featured distinctive Mazda styling cues particularly in the front fascia and interior details. Available in various body configurations including single cab, extended cab, and double cab, with both 4x2 and 4x4 drivetrain options. Powertrain options varied by market but typically included a 2.5L or 3.0L turbodiesel four-cylinder engine, with some markets also receiving a 2.6L gasoline option. Transmission choices included five-speed manual and five-speed automatic. The exterior design featured a bold front end with a prominent grille and angular headlights, though the side profile and rear were more conventional. The interior was functional and durable rather than luxurious, with varying levels of equipment depending on trim level. Designed primarily as a workhorse, the BT-50 offered payload capacity of up to approximately 1,500 kg and towing capabilities of up to 3,000 kg depending on configuration. Standard and available features varied significantly by market, ranging from basic work truck specifications to more comfortable personal-use configurations with power accessories, air conditioning, and audio systems. The first-generation BT-50 was particularly popular in Australia, Thailand, and other Asian and Pacific markets where midsize pickup trucks serve as both work vehicles and personal transportation."

  - name: "Second Generation"
    start_year: 2012
    end_year: 2020
    description: "The second-generation Mazda BT-50 continued to share its platform with the Ford Ranger but featured a more distinctive exterior design reflecting Mazda's 'Kodo' design language of the time, with a prominent grille, swept-back headlights, and flowing body lines unusual for a pickup truck. Available in various body styles including single cab, extended cab (Freestyle), and double cab configurations, with 4x2 and 4x4 drivetrain options. Primary powertrain options included a 2.2L turbodiesel four-cylinder producing approximately 150 horsepower and 375 Nm of torque, and a more powerful 3.2L five-cylinder turbodiesel generating 197 horsepower and 470 Nm of torque. Transmission choices included six-speed manual and six-speed automatic. The interior saw significant improvements in design, material quality, and technology compared to its predecessor, with higher trim levels offering features comparable to passenger cars including touchscreen infotainment, leather seating, dual-zone climate control, and comprehensive safety equipment. Off-road capability was enhanced with electronic locking rear differential, hill descent control, and up to 237mm of ground clearance. Maximum towing capacity increased to 3,500 kg on properly equipped models. A refresh in 2015 brought subtle styling updates, additional safety features, and infotainment improvements. Throughout its production, the second-generation BT-50 was noted for its combination of work capability and passenger car comfort, though its distinctive styling polarized opinions in the traditionally conservative pickup truck market."

  - name: "Third Generation"
    start_year: 2021
    end_year: null
    description: "The third-generation Mazda BT-50 marks a significant shift, now sharing its platform with the Isuzu D-Max rather than the Ford Ranger following the end of Mazda's product partnership with Ford. The exterior design adopts Mazda's current Kodo design language with a more refined, car-like appearance featuring the brand's signature grille, sleek headlights, and clean body lines—substantially differentiating it from its more rugged Isuzu counterpart. Available in various body styles and configurations depending on market, including 4x2 and 4x4 drivetrains. Powered primarily by an Isuzu-sourced 3.0L turbodiesel four-cylinder engine producing approximately 190 horsepower and 450 Nm of torque, with some markets also receiving a 1.9L turbodiesel option. Transmission options include six-speed manual and six-speed automatic. The interior represents a major upgrade with a modern, car-like design featuring an available 9-inch touchscreen infotainment system with wireless Apple CarPlay and Android Auto, digital instrument cluster, soft-touch materials, and sophisticated climate control. Safety technology expanded significantly to include autonomous emergency braking, adaptive cruise control, lane-keeping assist, blind-spot monitoring, and rear cross-traffic alert—making it one of the most technologically advanced vehicles in its class. Off-road capability remains strong with selectable four-wheel drive including low range, locking rear differential on select models, and wading depth of up to 800mm. Maximum towing capacity maintains the 3,500 kg rating of its predecessor. The third-generation BT-50 repositions the model as a more refined, technology-focused option in the midsize pickup segment while maintaining the robustness and capability expected of a workhorse vehicle."
